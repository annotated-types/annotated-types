[project]
name = "annotated-types"
description = "Reusable constraint types to use with typing.Annotated"
authors = [
    {name = "Adrian Garcia Badaracco", email = "1755071+adriangb@users.noreply.github.com"},
    {name = "Samuel Colvin", email = "s@muelcolvin.com"},
    {name = "Zac Hatfield-Dodds", email = "zac@zhd.dev"},
]
readme = "README.md"
repository = "https://github.com/annotated-types/annotated-types"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/annotated-types/annotated-types"
Source = "https://github.com/annotated-types/annotated-types"
Changelog = "https://github.com/annotated-types/annotated-types/releases"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "coverage",
    "pytest",
    "pytest-sugar",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "annotated_types/__init__.py"

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"

[tool.coverage.run]
source = ["annotated_types"]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise NotImplemented",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90"]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
