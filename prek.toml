#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "lint", name = "Lint", entry = "make lint", language = "system", types = ["python"], pass_filenames = false },
    { id = "typecheck", name = "Typecheck", entry = "make typecheck", language = "system", types = ["python"], pass_filenames = false },
]
