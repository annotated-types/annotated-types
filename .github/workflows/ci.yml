name: CI

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    name: test py-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', 'pypy3.11', '3.12', '3.13', '3.14', '3.15']

    runs-on: ubuntu-latest

    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v5

    - name: install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - run: uv sync

    - run: make test

    - run: uv run coverage xml

    - uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        env_vars: PYTHON

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.11'
        enable-cache: true

    - run: uv sync

    - run: uv run prek run --all-files --show-diff-on-failure

  deploy:
    needs:
      - test
      - lint
    if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    environment: annotated-types
    permissions:
      # required for trusted publishing to PyPI (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: check GITHUB_REF matches package version
        uses: samuelcolvin/check-python-version@v5
        with:
          version_file_path: annotated_types/__init__.py

      - name: build
        run: uv build

      # uv detects the ambient OIDC credentials (id-token: write + the
      # annotated-types environment) and mints the trusted-publishing token itself.
      - name: upload to pypi
        run: uv publish --trusted-publishing always
